  <!-- Citation 1: pandas -->
  <g transform="translate(0, 1250)">
    <text x="60" y="60" font-family="Consolas, monospace" font-size="34" fill="#858585" text-anchor="end">127</text>
    <text x="60" y="120" font-family="Consolas, monospace" font-size="34" fill="#858585" text-anchor="end">128</text>
