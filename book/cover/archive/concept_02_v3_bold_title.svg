    <text x="180" y="240" font-family="Consolas, monospace" font-size="36" fill="#C586C0">template</text>
    <text x="400" y="240" font-family="Consolas, monospace" font-size="36" fill="#ffffff">&lt;</text>
    <text x="430" y="240" font-family="Consolas, monospace" font-size="36" fill="#C586C0">typename</text>
    <text x="650" y="240" font-family="Consolas, monospace" font-size="36" fill="#4EC9B0"> Sample</text>
    <text x="800" y="240" font-family="Consolas, monospace" font-size="36" fill="#ffffff">&gt;</text>
    <text x="180" y="300" font-family="Consolas, monospace" font-size="36" fill="#C586C0">void</text>
    <text x="300" y="300" font-family="Consolas, monospace" font-size="36" fill="#DCDCAA"> operator()</text>
    <text x="560" y="300" font-family="Consolas, monospace" font-size="36" fill="#ffffff">(</text>
    <text x="590" y="300" font-family="Consolas, monospace" font-size="36" fill="#4EC9B0">Sample</text>
    <text x="740" y="300" font-family="Consolas, monospace" font-size="36" fill="#C586C0"> const</text>
    <text x="880" y="300" font-family="Consolas, monospace" font-size="36" fill="#ffffff">&amp;</text>
    <text x="910" y="300" font-family="Consolas, monospace" font-size="36" fill="#9CDCFE">x</text>
    <text x="940" y="300" font-family="Consolas, monospace" font-size="36" fill="#ffffff">) {</text>
  </g>

  <!-- Citation 4: scipy -->
