    <text x="180" y="240" font-family="Consolas, monospace" font-size="36" fill="#C586C0">cdef inline void</text>
    <text x="570" y="240" font-family="Consolas, monospace" font-size="36" fill="#DCDCAA"> add_mean</text>
    <text x="830" y="240" font-family="Consolas, monospace" font-size="36" fill="#ffffff">(...):</text>
    <text x="180" y="300" font-family="Consolas, monospace" font-size="36" fill="#9CDCFE">    delta</text>
    <text x="380" y="300" font-family="Consolas, monospace" font-size="36" fill="#ffffff"> = val - mean</text>
  </g>

