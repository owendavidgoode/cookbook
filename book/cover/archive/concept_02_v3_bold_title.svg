    <text x="180" y="180" font-family="Consolas, monospace" font-size="36" fill="#9CDCFE"># johndcook.com/blog/standard_deviation/</text>
    <text x="180" y="240" font-family="Consolas, monospace" font-size="36" fill="#C586C0">function</text>
    <text x="400" y="240" font-family="Consolas, monospace" font-size="36" fill="#DCDCAA"> _fit!</text>
    <text x="560" y="240" font-family="Consolas, monospace" font-size="36" fill="#ffffff">(o::</text>
    <text x="720" y="240" font-family="Consolas, monospace" font-size="36" fill="#4EC9B0">Variance</text>
    <text x="940" y="240" font-family="Consolas, monospace" font-size="36" fill="#ffffff">, x)</text>
    <text x="180" y="300" font-family="Consolas, monospace" font-size="36" fill="#9CDCFE">    o.n</text>
    <text x="340" y="300" font-family="Consolas, monospace" font-size="36" fill="#ffffff"> += </text>
    <text x="440" y="300" font-family="Consolas, monospace" font-size="36" fill="#B5CEA8">1</text>
  </g>

