    <text x="180" y="60" font-family="Consolas, monospace" font-size="36" fill="#6A9955"># Running variance using Welford's method</text>
    <text x="180" y="120" font-family="Consolas, monospace" font-size="36" fill="#6A9955"># Based on RunningStats::Push from</text>
