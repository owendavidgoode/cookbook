  <g transform="translate(0, 850)">
    <text x="60" y="80" font-family="Consolas, monospace" font-size="36" fill="#858585" text-anchor="end">7</text>
    <text x="60" y="160" font-family="Consolas, monospace" font-size="36" fill="#858585" text-anchor="end">8</text>
