<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2625" height="3750" viewBox="0 0 2625 3750">
  <!-- Concept 8: Typographic Minimal - Bold serif on cream -->

  <!-- Warm cream background -->
  <rect width="2625" height="3750" fill="#faf8f3"/>

  <!-- Subtle texture pattern -->
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#faf8f3"/>
      <circle cx="20" cy="20" r="0.5" fill="#e8e4dc" opacity="0.5"/>
      <circle cx="70" cy="50" r="0.5" fill="#e8e4dc" opacity="0.5"/>
      <circle cx="40" cy="80" r="0.5" fill="#e8e4dc" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="2625" height="3750" fill="url(#paper)"/>

  <!-- Main title - large, bold, centered -->
  <text x="1312" y="1500" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    You Can
  </text>
  <text x="1312" y="1780" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    Just Do
  </text>
  <text x="1312" y="2060" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    Things
  </text>

  <!-- Minimal decorative line -->
  <line x1="900" y1="2200" x2="1725" y2="2200" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Subtitle - smaller, italic -->
  <text x="1312" y="2350" font-family="Georgia, serif" font-size="52" fill="#4a4a4a" text-anchor="middle" font-style="italic">
    A Data Portrait of John D. Cook's Blog
  </text>

  <!-- Stats line - understated -->
  <text x="1312" y="2500" font-family="Georgia, serif" font-size="36" fill="#888888" text-anchor="middle">
    5,233 posts · 17 years · 1.8 million words
  </text>

  <!-- Author at bottom -->
  <text x="1312" y="3400" font-family="Georgia, serif" font-size="64" fill="#1a1a1a" text-anchor="middle">
    Owen D. Goode
  </text>

</svg>
