<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2625" height="3750" viewBox="0 0 2625 3750">
  <!-- Concept 10: The Ripple - Single drop hitting still water -->

  <defs>
    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a"/>
      <stop offset="50%" style="stop-color:#0d2030"/>
      <stop offset="100%" style="stop-color:#050a10"/>
    </linearGradient>

    <!-- Ripple glow -->
    <radialGradient id="rippleGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6; stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d2030; stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Dark water background -->
  <rect width="2625" height="3750" fill="url(#waterGrad)"/>

  <!-- Subtle glow from ripple center -->
  <ellipse cx="1312" cy="1400" rx="1200" ry="800" fill="url(#rippleGlow)"/>

  <!-- Concentric ripples - expanding outward from center -->
  <!-- Each ripple represents the spreading influence -->
  <g fill="none" stroke="#4a9eda" stroke-linecap="round">
    <!-- Center point - the first post -->
    <circle cx="1312" cy="1400" r="8" fill="#ffffff"/>

    <!-- Inner ripples - stronger -->
    <ellipse cx="1312" cy="1400" rx="60" ry="30" stroke-width="3" opacity="0.9"/>
    <ellipse cx="1312" cy="1400" rx="120" ry="60" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="1312" cy="1400" rx="200" ry="100" stroke-width="2.5" opacity="0.75"/>
    <ellipse cx="1312" cy="1400" rx="300" ry="150" stroke-width="2" opacity="0.7"/>
    <ellipse cx="1312" cy="1400" rx="420" ry="210" stroke-width="2" opacity="0.65"/>

    <!-- Middle ripples -->
    <ellipse cx="1312" cy="1400" rx="560" ry="280" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="1312" cy="1400" rx="720" ry="360" stroke-width="1.5" opacity="0.45"/>
    <ellipse cx="1312" cy="1400" rx="900" ry="450" stroke-width="1.5" opacity="0.35"/>

    <!-- Outer ripples - fading -->
    <ellipse cx="1312" cy="1400" rx="1100" ry="550" stroke-width="1" opacity="0.25"/>
    <ellipse cx="1312" cy="1400" rx="1320" ry="660" stroke-width="1" opacity="0.15"/>
    <ellipse cx="1312" cy="1400" rx="1560" ry="780" stroke-width="0.5" opacity="0.08"/>
  </g>

  <!-- Subtle reflections on water surface -->
  <g fill="#ffffff" opacity="0.03">
    <ellipse cx="600" cy="600" rx="200" ry="50"/>
    <ellipse cx="2000" cy="800" rx="180" ry="40"/>
    <ellipse cx="400" cy="1800" rx="150" ry="35"/>
    <ellipse cx="2200" cy="1600" rx="170" ry="45"/>
  </g>

  <!-- Drop above water (frozen in moment of impact) -->
  <ellipse cx="1312" cy="1350" rx="15" ry="20" fill="#ffffff" opacity="0.8"/>

  <!-- Tiny splash particles -->
  <circle cx="1280" cy="1380" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="1344" cy="1375" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="1300" cy="1365" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="1330" cy="1370" r="3" fill="#ffffff" opacity="0.5"/>

  <!-- Title -->
  <text x="1312" y="2500" font-family="Georgia, serif" font-size="156" font-weight="bold" fill="#ffffff" text-anchor="middle">
    You Can Just
  </text>
  <text x="1312" y="2700" font-family="Georgia, serif" font-size="156" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Do Things
  </text>

  <!-- Subtitle -->
  <text x="1312" y="2900" font-family="Georgia, serif" font-size="56" fill="#7cb3d9" text-anchor="middle" font-style="italic">
    A Data Portrait of John D. Cook's Blog
  </text>

  <!-- Stats - like ripple count -->
  <text x="1312" y="3050" font-family="Georgia, serif" font-size="42" fill="#4a7a9a" text-anchor="middle">
    One voice · 5,233 ripples · 17 years of reach
  </text>

  <!-- Author -->
  <text x="1312" y="3500" font-family="Georgia, serif" font-size="64" fill="#ffffff" text-anchor="middle">
    Owen D. Goode
  </text>

</svg>
