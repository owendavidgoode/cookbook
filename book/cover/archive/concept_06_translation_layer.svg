<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2625" height="3750" viewBox="0 0 2625 3750">
  <!-- Concept 6: The Translation Layer - academic math to code -->

  <!-- Split background -->
  <rect x="0" y="0" width="1312" height="3750" fill="#faf9f7"/>
  <rect x="1312" y="0" width="1313" height="3750" fill="#1e1e1e"/>

  <!-- Left side: Academic notation -->
  <g transform="translate(100, 600)">
    <text x="0" y="0" font-family="Times New Roman, serif" font-size="72" fill="#2d2d2d" font-style="italic">
      Γ(z) = ∫₀^∞ t^(z-1) e^(-t) dt
    </text>
    <text x="0" y="150" font-family="Times New Roman, serif" font-size="56" fill="#4a4a4a">
      Welford (1962):
    </text>
    <text x="0" y="240" font-family="Times New Roman, serif" font-size="48" fill="#4a4a4a" font-style="italic">
      M_k = M_(k-1) + (x_k - M_(k-1))/k
    </text>
    <text x="0" y="320" font-family="Times New Roman, serif" font-size="48" fill="#4a4a4a" font-style="italic">
      S_k = S_(k-1) + (x_k - M_(k-1))(x_k - M_k)
    </text>

    <text x="0" y="500" font-family="Times New Roman, serif" font-size="56" fill="#4a4a4a">
      Lanczos Approximation:
    </text>
    <text x="0" y="590" font-family="Times New Roman, serif" font-size="44" fill="#4a4a4a" font-style="italic">
      Γ(z+1) ≈ √(2π) (z + γ + ½)^(z+½)
    </text>
    <text x="0" y="660" font-family="Times New Roman, serif" font-size="44" fill="#4a4a4a" font-style="italic">
          × e^(-(z+γ+½)) × A_g(z)
    </text>

    <!-- Journal citation style -->
    <text x="0" y="850" font-family="Times New Roman, serif" font-size="36" fill="#888888" font-style="italic">
      Technometrics, Vol. 4, No. 3
    </text>
    <text x="0" y="910" font-family="Times New Roman, serif" font-size="36" fill="#888888" font-style="italic">
      (Aug., 1962), pp. 419-420
    </text>
  </g>

  <!-- Right side: Working code -->
  <g transform="translate(1400, 600)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="42" fill="#569cd6">def</text>
    <text x="100" y="0" font-family="Consolas, monospace" font-size="42" fill="#dcdcaa"> gamma</text>
    <text x="270" y="0" font-family="Consolas, monospace" font-size="42" fill="#ffffff">(z):</text>

    <text x="0" y="80" font-family="Consolas, monospace" font-size="42" fill="#6a9955">    # Lanczos approx</text>

    <text x="0" y="160" font-family="Consolas, monospace" font-size="42" fill="#9cdcfe">    g</text>
    <text x="50" y="160" font-family="Consolas, monospace" font-size="42" fill="#ffffff"> = </text>
    <text x="120" y="160" font-family="Consolas, monospace" font-size="42" fill="#b5cea8">7</text>

    <text x="0" y="240" font-family="Consolas, monospace" font-size="42" fill="#9cdcfe">    c</text>
    <text x="50" y="240" font-family="Consolas, monospace" font-size="42" fill="#ffffff"> = [</text>
    <text x="130" y="240" font-family="Consolas, monospace" font-size="42" fill="#b5cea8">0.9999...</text>
    <text x="380" y="240" font-family="Consolas, monospace" font-size="42" fill="#ffffff">,</text>

    <text x="0" y="320" font-family="Consolas, monospace" font-size="42" fill="#b5cea8">         676.52...</text>
    <text x="350" y="320" font-family="Consolas, monospace" font-size="42" fill="#ffffff">,</text>

    <text x="0" y="400" font-family="Consolas, monospace" font-size="42" fill="#b5cea8">        -1259.1...</text>
    <text x="380" y="400" font-family="Consolas, monospace" font-size="42" fill="#ffffff">]</text>

    <text x="0" y="560" font-family="Consolas, monospace" font-size="42" fill="#c586c0">    return</text>
    <text x="200" y="560" font-family="Consolas, monospace" font-size="42" fill="#9cdcfe"> result</text>

    <!-- Code comment linking back -->
    <text x="0" y="750" font-family="Consolas, monospace" font-size="36" fill="#6a9955">
      # johndcook.com/blog/
    </text>
    <text x="0" y="810" font-family="Consolas, monospace" font-size="36" fill="#6a9955">
      #   gamma_function/
    </text>
  </g>

  <!-- Central bridge/gradient -->
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#faf9f7"/>
      <stop offset="50%" style="stop-color:#888888"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
  </defs>
  <rect x="1262" y="0" width="100" height="3750" fill="url(#bridgeGrad)"/>

  <!-- Arrow showing translation -->
  <polygon points="1260,1900 1365,1850 1365,1880 1450,1880 1450,1920 1365,1920 1365,1950" fill="#3b82f6"/>

  <!-- Title (spans both sides) -->
  <text x="1312" y="2600" font-family="Georgia, serif" font-size="144" font-weight="bold" fill="#1e1e1e" text-anchor="middle">
    You Can
  </text>
  <text x="656" y="2780" font-family="Georgia, serif" font-size="144" font-weight="bold" fill="#1e1e1e" text-anchor="middle">
    Just Do
  </text>
  <text x="1968" y="2780" font-family="Georgia, serif" font-size="144" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Things
  </text>

  <!-- Subtitle -->
  <text x="656" y="3000" font-family="Georgia, serif" font-size="48" fill="#4a4a4a" text-anchor="middle" font-style="italic">
    A Data Portrait of
  </text>
  <text x="1968" y="3000" font-family="Georgia, serif" font-size="48" fill="#a0a0a0" text-anchor="middle" font-style="italic">
    John D. Cook's Blog
  </text>

  <!-- Author -->
  <text x="1312" y="3500" font-family="Georgia, serif" font-size="64" text-anchor="middle">
    <tspan fill="#1e1e1e">Owen D.</tspan><tspan fill="#ffffff"> Goode</tspan>
  </text>

</svg>
