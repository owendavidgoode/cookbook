<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2625" height="3750" viewBox="0 0 2625 3750">
  <!-- Concept 2: The Code Comment - IDE style with pandas citation -->

  <!-- Background - VS Code dark theme -->
  <rect width="2625" height="3750" fill="#1e1e1e"/>

  <!-- Line numbers gutter -->
  <rect x="0" y="0" width="150" height="3750" fill="#252526"/>

  <!-- Title area - top -->
  <rect x="150" y="200" width="2475" height="600" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="1387" y="420" font-family="Georgia, serif" font-size="144" font-weight="bold" fill="#ffffff" text-anchor="middle">
    You Can Just
  </text>
  <text x="1387" y="600" font-family="Georgia, serif" font-size="144" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Do Things
  </text>

  <!-- Code block area -->
  <g transform="translate(0, 900)">
    <!-- Line numbers -->
    <text x="80" y="100" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">127</text>
    <text x="80" y="180" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">128</text>
    <text x="80" y="260" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">129</text>
    <text x="80" y="340" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">130</text>
    <text x="80" y="420" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">131</text>
    <text x="80" y="500" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">132</text>
    <text x="80" y="580" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">133</text>
    <text x="80" y="660" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">134</text>
    <text x="80" y="740" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">135</text>
    <text x="80" y="820" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">136</text>
    <text x="80" y="900" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">137</text>
    <text x="80" y="980" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">138</text>
    <text x="80" y="1060" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">139</text>
    <text x="80" y="1140" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">140</text>
    <text x="80" y="1220" font-family="Consolas, monospace" font-size="48" fill="#858585" text-anchor="end">141</text>

    <!-- Code with syntax highlighting -->
    <!-- Comment block - the key citation -->
    <text x="200" y="100" font-family="Consolas, monospace" font-size="44" fill="#6A9955"># groupby.pyx - pandas core</text>
    <text x="200" y="180" font-family="Consolas, monospace" font-size="44" fill="#6A9955">#</text>
    <text x="200" y="260" font-family="Consolas, monospace" font-size="44" fill="#6A9955"># Running stats update based on</text>
    <text x="200" y="340" font-family="Consolas, monospace" font-size="44" fill="#6A9955"># RunningStats::Push from</text>
    <text x="200" y="420" font-family="Consolas, monospace" font-size="44" fill="#9CDCFE"># https://www.johndcook.com/</text>
    <text x="200" y="500" font-family="Consolas, monospace" font-size="44" fill="#9CDCFE">#     blog/skewness_kurtosis/</text>
    <text x="200" y="580" font-family="Consolas, monospace" font-size="44" fill="#6A9955">#</text>

    <!-- Python code -->
    <text x="200" y="740" font-family="Consolas, monospace" font-size="44" fill="#C586C0">def</text>
    <text x="310" y="740" font-family="Consolas, monospace" font-size="44" fill="#DCDCAA"> _groupby_skew</text>
    <text x="730" y="740" font-family="Consolas, monospace" font-size="44" fill="#ffffff">(</text>
    <text x="765" y="740" font-family="Consolas, monospace" font-size="44" fill="#9CDCFE">values</text>
    <text x="980" y="740" font-family="Consolas, monospace" font-size="44" fill="#ffffff">):</text>

    <text x="200" y="820" font-family="Consolas, monospace" font-size="44" fill="#CE9178">    """</text>
    <text x="200" y="900" font-family="Consolas, monospace" font-size="44" fill="#CE9178">    Compute skewness using</text>
    <text x="200" y="980" font-family="Consolas, monospace" font-size="44" fill="#CE9178">    Welford's online algorithm</text>
    <text x="200" y="1060" font-family="Consolas, monospace" font-size="44" fill="#CE9178">    """</text>

    <text x="200" y="1220" font-family="Consolas, monospace" font-size="44" fill="#9CDCFE">    n</text>
    <text x="280" y="1220" font-family="Consolas, monospace" font-size="44" fill="#ffffff"> = </text>
    <text x="370" y="1220" font-family="Consolas, monospace" font-size="44" fill="#B5CEA8">0</text>
  </g>

  <!-- Tagline -->
  <text x="1387" y="2700" font-family="Georgia, serif" font-size="52" fill="#858585" text-anchor="middle" font-style="italic">
    Hidden in production code worldwide
  </text>

  <!-- Subtitle -->
  <text x="1387" y="2900" font-family="Georgia, serif" font-size="56" fill="#9CDCFE" text-anchor="middle">
    A Data Portrait of John D. Cook's Blog
  </text>

  <!-- Stats -->
  <text x="1387" y="3050" font-family="Consolas, monospace" font-size="42" fill="#6A9955" text-anchor="middle">
    // 5,233 posts · 17 years · pandas, TensorFlow, Julia
  </text>

  <!-- Author -->
  <text x="1387" y="3500" font-family="Georgia, serif" font-size="64" fill="#ffffff" text-anchor="middle">
    Owen D. Goode
  </text>

</svg>
